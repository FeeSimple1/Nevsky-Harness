name: Validate long-campaign repair
on:
  push:
    branches: [fix/nevsky-long-campaign-20261010]
    paths: ['.github/workflows/apply-long-campaign-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Apply checksum-verified patch to the reviewed source
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          encoded = pathlib.Path('.repair/long-campaign.patch.b64').read_text().strip()
          # Normalize two text-transfer insertions, then check the exact
          # locally tested patch. Any other corruption fails this gate.
          encoded = encoded.replace('txKH3zi', 'txKHzi').replace('RkM5ln', 'RkMln')
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '5c18c40b19f838ea662c5d99eb7663ad72dde7ba5cc8c8c68a55fea4af0e0a86'
          pathlib.Path('/tmp/long-campaign.patch').write_bytes(patch)
          subprocess.run(['git', 'diff', '--exit-code', '394de473fd886f3f5f898dc2d0dcfb3b517253cb', '--', 'src', 'scripts', 'tests', 'docs'], check=True)
          subprocess.run(['git', 'apply', '--check', '/tmp/long-campaign.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/long-campaign.patch'], check=True)
          PY
      - name: Reconstruct saved positions from the complete original logs
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          from nevsky.actions import apply_action
          from nevsky.scenarios import load_scenario
          ref = '34617cf46c98df067e7e918b7a39bc75f24e51e1'
          subprocess.run(['git', 'fetch', 'origin', ref], check=True)
          prefix = 'reports/crusade_20261010/'
          def read(path):
              return json.loads(subprocess.check_output(['git', 'show', ref + ':' + prefix + path]))
          dest = pathlib.Path('tests/data/crusade_20261010')
          dest.mkdir(parents=True, exist_ok=True)
          games = {}
          for name, folder in [('first', ''), ('reserve', 'reserve_game/')]:
              summary = read(folder + 'summary.json')
              transcript = read(folder + 'transcript.json')
              payload = {'scenario': summary['scenario'], 'seed': summary['seed'], 'expected_winner': summary['winner'], 'expected_box': summary['last_box'], 'actions': [entry['action'] for entry in transcript]}
              assert len(payload['actions']) == summary['actions_including_setup']
              (dest / (name + '_replay.json')).write_text(json.dumps(payload, separators=(',', ':')) + '\n')
              games['first' if name == 'first' else 'reserve_game'] = payload
          index = {}
          for name, result in read('reproductions/results.json').items():
              game = games[result['game']]
              state = load_scenario(game['scenario'], seed=game['seed'])
              for action in game['actions'][:result['before_action_index']]:
                  apply_action(state, action)
              state.history = []
              (dest / (name + '.json')).write_text(json.dumps(state.model_dump(mode='json'), sort_keys=True, separators=(',', ':')) + '\n')
              index[name] = {'file': name + '.json', 'actions': result['actions'], 'original_action_index': result['before_action_index'], 'box': result['calendar_box']}
          (dest / 'index.json').write_text(json.dumps(index, indent=2) + '\n')
          PY
      - name: Include the property-test budget-lifecycle correction
        run: python .repair/expire-lordship.py
      - name: Run all regression and property tests
        run: python -m pytest -q -n 2 -o addopts='' --junitxml=/tmp/long-campaign-tests.xml
      - name: Run 150-game invariant sweep
        run: python scripts/fuzz_invariants.py --seeds 1-25
      - name: Check repaired source and new test code
        run: |
          python -m ruff check src/nevsky/held_actions.py tests/test_long_campaign_fixes_20261010.py
          git diff --check
      - name: Commit only verified repair files to the repair branch
        run: |
          git config user.name ChatGPT
          git config user.email noreply@openai.com
          git rm .github/workflows/export-repair-source.yml .github/workflows/repair-dependencies.yml .github/workflows/apply-long-campaign-repair.yml .repair/long-campaign.patch.b64 .repair/expire-lordship.py
          git add src/nevsky/actions.py src/nevsky/events.py src/nevsky/legal_moves.py src/nevsky/llm/tools.py src/nevsky/held_actions.py scripts/chatgpt_play_helper.py scripts/llm_self_play.py tests/test_long_campaign_fixes_20261010.py tests/data/crusade_20261010 docs/LONG_CAMPAIGN_FIXES_20261010.md
          git commit -m 'Fix long-campaign Hold choices, Lordship budgets, extra Muster, and Treachery bookkeeping'
          git push origin HEAD:fix/nevsky-long-campaign-20261010
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nevsky-long-repair-test-results
          path: /tmp/long-campaign-tests.xml
          retention-days: 7

name: Export long-campaign repair source
on:
  push:
    branches: [fix/nevsky-long-campaign-20261010]
    paths: ['.github/workflows/export-repair-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 394de473fd886f3f5f898dc2d0dcfb3b517253cb
      - run: git archive --format=zip --output=/tmp/nevsky-repair-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: nevsky-repair-source
          path: /tmp/nevsky-repair-source.zip
          retention-days: 1

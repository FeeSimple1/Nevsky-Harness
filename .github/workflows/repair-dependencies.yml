name: Repair test dependencies
on:
  push:
    branches: [fix/nevsky-long-campaign-20261010]
    paths: ['.github/workflows/repair-dependencies.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip download --only-binary=:all: hypothesis pytest-xdist ruff -d wheels
      - uses: actions/upload-artifact@v4
        with:
          name: nevsky-test-wheels
          path: wheels
          retention-days: 1

name: CI
 
# Runs the full test suite and a deeper self-play invariant fuzz sweep on
# every push and pull request. The fuzz sweep is the automated version of the
# adversarial self-play checks that have repeatedly caught engine bugs the
# curated unit tests missed (Rule 5.2 termination, stranded Routed units,
# turn-freeze after game over, etc.). See scripts/fuzz_invariants.py.
 
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
 
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
 
      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
 
      - name: Run test suite (includes bounded fuzz test)
        run: pytest -q -p no:cacheprovider
 
      - name: Deep self-play invariant fuzz sweep
        run: python scripts/fuzz_invariants.py --seeds 1-25
 

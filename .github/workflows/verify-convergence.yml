name: Verify sustained Nevsky validation
on:
  push:
    branches: [test/nevsky-convergence-20261010]
    paths: ['.github/workflows/verify-convergence.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply checksum-verified repair to the pinned source
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          base = '2258489c657403331cc3de5d67fd455b0af88bce'
          subprocess.run(['git', 'diff', '--exit-code', base, '--', 'src', 'scripts', 'tests', 'docs'], check=True)
          encoded = ''.join(pathlib.Path('.repair/convergence.part' + str(i)).read_text().strip() for i in (1,2,3))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a06cfde58d091145315bcc2b53fa3403b487bb1fa53c8fc6e42c72e2b1897605'
          pathlib.Path('/tmp/convergence.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/convergence.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/convergence.patch'], check=True)
          pathlib.Path('/tmp/validation').mkdir()
          PY
      - name: Run complete regression and property suite
        run: PYTHONPATH=src python -m pytest -q -n 4 --junitxml=/tmp/validation/tests.xml
      - name: Require actual Game End in all 600 invariant cases
        run: |
          set -o pipefail
          PYTHONPATH=src python scripts/fuzz_invariants.py --seeds 1-100 --max-steps 3000 --require-completion --report-json /tmp/validation/invariants.json | tee /tmp/validation/invariants.log
      - name: Check 3000 opening prefixes across all six scenarios
        run: |
          set -o pipefail
          PYTHONPATH=src python scripts/check_openings.py --seeds 500 --report /tmp/validation/openings.json | tee /tmp/validation/openings.log
      - name: Run 48 complete audited multi-policy Crusade games
        run: |
          set -o pipefail
          PYTHONPATH=src python scripts/convergence_suite.py --seeds 20261012-20261027 --workers 4 --timeout 600 --output /tmp/validation/campaigns | tee /tmp/validation/campaigns.log
      - name: Check new test code and repair formatting
        run: |
          python -m ruff check --select I,F,B,UP scripts/check_openings.py scripts/convergence_play.py scripts/convergence_suite.py tests/test_convergence_20261010.py tests/test_convergence_reporting.py tests/test_opening_deadlocks_20261010.py
          python -m compileall -q src scripts tests
          git diff --check
      - name: Record actual gate results and commit only tested repair files
        run: |
          python - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          root = ET.parse('/tmp/validation/tests.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else root.findall('testsuite')
          counts = {key: sum(int(s.get(key, 0)) for s in suites) for key in ('tests','failures','errors','skipped')}
          assert counts == {'tests':1815,'failures':0,'errors':0,'skipped':0}, counts
          inv = json.loads(pathlib.Path('/tmp/validation/invariants.json').read_text())
          assert inv['cases'] == 600 and inv['completed'] == 600 and inv['step_limited'] == 0 and not inv['violations'], inv
          opening = json.loads(pathlib.Path('/tmp/validation/openings.json').read_text())
          assert opening['opening_prefixes'] == 3000 and not opening['failures'], opening
          games = json.loads(pathlib.Path('/tmp/validation/campaigns/report.json').read_text())
          assert games['clean'] and games['cases'] == 48 and games['clean_completed'] == 48 and games['source_unchanged'], games
          note = '\n## Completed final-build validation\n\n'
          note += '- Full local Python 3.13.5 suite: **1,815 passed**, no failures, errors or skips.\n'
          note += '- Full GitHub Actions Python 3.12 suite: **1,815 passed**, no failures, errors or skips, verified from JUnit.\n'
          note += '- **44 new regression cases**: 27 movement, 11 opening deadlock/assignment, and 6 reporting/gate checks.\n'
          note += '- On both platforms, **600 of 600 invariant cases reached Game End**, with no violations or step-limited cases. These include short scenarios and early victories, not 600 full-length Crusades.\n'
          note += '- On both platforms, **3,000 opening prefixes** across six loadable scenarios cleared without failure; the local run checked 29,950 offered choices. Prefixes are not counted as games.\n'
          note += '- Local final-build campaign gate: **48 of 48 completed cleanly**, **42 reached turn 16**, **76,635 actions** and **3,851 save/reload checks**; every complete log replayed exactly and the source digest was unchanged.\n'
          note += '- GitHub final-build campaign gate: **' + str(games['clean_completed']) + ' of ' + str(games['cases']) + ' completed cleanly**, **' + str(games['clean_full_16_turn']) + ' reached turn 16**, **' + str(games['actions']) + ' actions** and **' + str(games['save_reload_checks']) + ' save/reload checks**; all replay and source-integrity gates passed.\n'
          note += '- Targeted Ruff checks on new test/player modules, compilation and git diff --check passed.\n\n'
          note += 'Remote evidence: Actions run `' + os.environ['GITHUB_RUN_ID'] + '`, artifact `nevsky-convergence-results`. The second platform reruns the same 48 cases; it does not create 48 additional independent seeds.\n\n'
          note += 'The local campaign gate exercised 2,180 Marches, 37 field-Battle responses, 35 Storms, 21 Sallies, 50 Sails, 336 Lordship Hold plays, 165 other Hold plays and 128 Lieutenant placements. No Legate-use or Stonemasons command was selected in that batch; those remain covered only by targeted tests or earlier work, not by a new full-game trajectory here. Counts of actions do not imply every legal target or argument combination was tested.\n\n'
          note += 'This is a sustained clean batch under the documented checks, not a guarantee that every possible game state is bug-free. A newly confirmed defect resets the clean-build gate. Temporary source-export and patch-transport workflows are excluded from the final code tree; ordinary CI is unchanged.\n'
          p = pathlib.Path('docs/CONVERGENCE_20261010.md')
          p.write_text(p.read_text()+note)
          PY
          git rm .github/workflows/export-convergence-source.yml .github/workflows/verify-convergence.yml .repair/convergence.part1 .repair/convergence.part2 .repair/convergence.part3
          git add docs/CONVERGENCE_20261010.md docs/VALIDATION_PROTOCOL.md scripts/check_openings.py scripts/convergence_play.py scripts/convergence_suite.py scripts/fuzz_invariants.py src/nevsky/actions.py src/nevsky/campaign.py src/nevsky/legal_moves.py tests/test_convergence_20261010.py tests/test_convergence_reporting.py tests/test_opening_deadlocks_20261010.py
          git add -f tests/data/convergence_20261010
          git diff --cached --check
          git config user.name ChatGPT
          git config user.email noreply@openai.com
          git commit -m 'Fix hidden March choices and opening deadlocks; require sustained completed-game validation'
          git push origin HEAD:test/nevsky-convergence-20261010
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nevsky-convergence-results
          path: |
            /tmp/validation/tests.xml
            /tmp/validation/invariants.json
            /tmp/validation/invariants.log
            /tmp/validation/openings.json
            /tmp/validation/openings.log
            /tmp/validation/campaigns.log
            /tmp/validation/campaigns/report.json
            /tmp/validation/campaigns/*/summary.json
            /tmp/validation/campaigns/*/transcript.json
            /tmp/validation/campaigns/*/findings.json
          retention-days: 7
